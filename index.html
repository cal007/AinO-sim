<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>AïnO Governance Simulation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind CDN (optional, nur für Styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body class="bg-gray-950 text-gray-100">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── Config ───────────────────────────────────────────────────────────────
    const DEPT_NAMES = ["Sales", "Ops", "Finance", "Product"];
    const MODES = { NORMAL: "Normal", TENSION: "Tension", CRISIS: "Crisis" };

    const DEFAULT_CONFIG = {
      ticks: 60,
      gamingRate: 0.02,
      gamingDecay: { Normal: 0.01, Tension: 0.02, Crisis: 0.03 },
      shadowNoise: 0.02,
      thresholds: {
        tension: 0.25,
        crisis: 0.50,
        reEscalation: 2,
        latency: 14
      },
      shockDurationMs: 150
    };

    // ─── Helpers ──────────────────────────────────────────────────────────────
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const rand = (lo, hi) => lo + Math.random() * (hi - lo);

    function initDept(name) {
      return {
        name,
        kpi: 0.5,
        reality: 0.5,
        gaming: 0,
        shadowMetric: 0.5,
        latency: 0,
        reEscalations: 0
      };
    }

    // ─── Simulation Core ──────────────────────────────────────────────────────
    function stepBaselineDept(dept, cfg, politicalShock) {
      const realityDrift = rand(-0.03, 0.03) + (politicalShock ? rand(-0.08, 0) : 0);
      const newReality = clamp(dept.reality + realityDrift, 0, 1);

      const gamingPressure = 0.015 + dept.gaming * 0.01;
      const newKpi = clamp(dept.kpi + gamingPressure + rand(-0.01, 0.01), 0, 1);

      const newGaming = clamp(dept.gaming + cfg.gamingRate, 0, 1);

      return { ...dept, reality: newReality, kpi: newKpi, gaming: newGaming };
    }

    function stepAinoDept(dept, cfg, politicalShock, mode) {
      const realityDrift = rand(-0.03, 0.03) + (politicalShock ? rand(-0.08, 0) : 0);
      const newReality = clamp(dept.reality + realityDrift, 0, 1);

      const shadowNoise = rand(-cfg.shadowNoise, cfg.shadowNoise);
      const newShadow = clamp(newReality + shadowNoise, 0, 1);

      const modeFactors = {
        Normal: { pressure: 1.0, decay: cfg.gamingDecay.Normal },
        Tension: { pressure: 0.6, decay: cfg.gamingDecay.Tension },
        Crisis: { pressure: 0.3, decay: cfg.gamingDecay.Crisis }
      };
      const f = modeFactors[mode] || modeFactors.Normal;

      const gamingPressure = 0.015 * f.pressure + dept.gaming * 0.005 * f.pressure;
      const newKpi = clamp(dept.kpi + gamingPressure + rand(-0.01, 0.01), 0, 1);

      const newGaming = clamp(dept.gaming + cfg.gamingRate - f.decay, 0, 1);

      // Latency & Re-Escalations
      const divergence = Math.abs(newKpi - newShadow);
      let newLatency = dept.latency + 1;
      let newReEsc = dept.reEscalations;
      if (divergence > cfg.thresholds.tension) {
        if (newLatency > cfg.thresholds.latency) {
          newReEsc = dept.reEscalations + 1;
          newLatency = 0;
        }
      } else {
        newLatency = 0;
      }

      return {
        ...dept,
        reality: newReality,
        kpi: newKpi,
        gaming: newGaming,
        shadowMetric: newShadow,
        latency: newLatency,
        reEscalations: newReEsc
      };
    }

    function computeMode(depts, cfg, prevMode) {
      const avgDiv =
        depts.reduce((s, d) => s + Math.abs(d.kpi - d.shadowMetric), 0) / depts.length;
      const maxReEsc = Math.max(...depts.map(d => d.reEscalations));

      if (avgDiv >= cfg.thresholds.crisis || maxReEsc >= cfg.thresholds.reEscalation) {
        return MODES.CRISIS;
      }
      if (avgDiv >= cfg.thresholds.tension) {
        if (prevMode === MODES.CRISIS && avgDiv > cfg.thresholds.tension * 0.8) {
          return MODES.CRISIS;
        }
        return MODES.TENSION;
      }
      if (prevMode === MODES.TENSION && avgDiv > cfg.thresholds.tension * 0.6) {
        return MODES.TENSION;
      }
      return MODES.NORMAL;
    }

    function computeOrgHealth(depts) {
      const avgDiv =
        depts.reduce((s, d) => s + Math.abs(d.kpi - d.reality), 0) / depts.length;
      const avgGaming = depts.reduce((s, d) => s + d.gaming, 0) / depts.length;
      return clamp(1 - avgDiv * 0.9 - avgGaming * 0.3, 0, 1);
    }

    function runTick(state, cfg) {
      if (state.tick >= cfg.ticks) return state;

      const shock = state.shockActive;

      const newBaseline = state.baselineDepts.map(d =>
        stepBaselineDept(d, cfg, shock)
      );
      const newAino = state.ainoDepts.map(d =>
        stepAinoDept(d, cfg, shock, state.mode)
      );

      const newMode = computeMode(newAino, cfg, state.mode);

      const maxReEsc = Math.max(...newAino.map(d => d.reEscalations));
      const riskDelta =
        newMode === MODES.CRISIS ? 0.01 :
        newMode === MODES.TENSION ? 0.005 :
        -0.003;
      const newCapture = clamp(state.captureRisk + riskDelta + maxReEsc * 0.001, 0, 1);

      const bh = computeOrgHealth(newBaseline);
      const ah = computeOrgHealth(newAino);
      const div =
        newAino.reduce((s, d) => s + Math.abs(d.kpi - d.shadowMetric), 0) /
        newAino.length;

      const modeIntensity =
        newMode === MODES.NORMAL ? 0.2 :
        newMode === MODES.TENSION ? 0.6 : 1.0;

      return {
        ...state,
        tick: state.tick + 1,
        baselineDepts: newBaseline,
        ainoDepts: newAino,
        mode: newMode,
        captureRisk: newCapture,
        history: {
          baseHealth: [...state.history.baseHealth, bh],
          ainoHealth: [...state.history.ainoHealth, ah],
          divergence: [...state.history.divergence, div],
          mode: [...state.history.mode, modeIntensity]
        }
      };
    }

    function createInitialState() {
      return {
        tick: 0,
        baselineDepts: DEPT_NAMES.map(initDept),
        ainoDepts: DEPT_NAMES.map(initDept),
        mode: MODES.NORMAL,
        captureRisk: 0,
        shockActive: false,
        history: {
          baseHealth: [],
          ainoHealth: [],
          divergence: [],
          mode: []
        }
      };
    }

    // ─── WebWorker Setup (optional, hier inline via Blob) ─────────────────────
    const workerCode = `
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const rand = (lo, hi) => lo + Math.random() * (hi - lo);
      const MODES = { NORMAL: "Normal", TENSION: "Tension", CRISIS: "Crisis" };

      function stepBaselineDept(dept, cfg, politicalShock) {
        const realityDrift = rand(-0.03, 0.03) + (politicalShock ? rand(-0.08, 0) : 0);
        const newReality = clamp(dept.reality + realityDrift, 0, 1);
        const gamingPressure = 0.015 + dept.gaming * 0.01;
        const newKpi = clamp(dept.kpi + gamingPressure + rand(-0.01, 0.01), 0, 1);
        const newGaming = clamp(dept.gaming + cfg.gamingRate, 0, 1);
        return { ...dept, reality: newReality, kpi: newKpi, gaming: newGaming };
      }

      function stepAinoDept(dept, cfg, politicalShock, mode) {
        const realityDrift = rand(-0.03, 0.03) + (politicalShock ? rand(-0.08, 0) : 0);
        const newReality = clamp(dept.reality + realityDrift, 0, 1);
        const shadowNoise = rand(-cfg.shadowNoise, cfg.shadowNoise);
        const newShadow = clamp(newReality + shadowNoise, 0, 1);
        const modeFactors = {
          Normal: { pressure: 1.0, decay: cfg.gamingDecay.Normal },
          Tension: { pressure: 0.6, decay: cfg.gamingDecay.Tension },
          Crisis: { pressure: 0.3, decay: cfg.gamingDecay.Crisis }
        };
        const f = modeFactors[mode] || modeFactors.Normal;
        const gamingPressure = 0.015 * f.pressure + dept.gaming * 0.005 * f.pressure;
        const newKpi = clamp(dept.kpi + gamingPressure + rand(-0.01, 0.01), 0, 1);
        const newGaming = clamp(dept.gaming + cfg.gamingRate - f.decay, 0, 1);
        const divergence = Math.abs(newKpi - newShadow);
        let newLatency = dept.latency + 1;
        let newReEsc = dept.reEscalations;
        if (divergence > cfg.thresholds.tension) {
          if (newLatency > cfg.thresholds.latency) {
            newReEsc = dept.reEscalations + 1;
            newLatency = 0;
          }
        } else {
          newLatency = 0;
        }
        return {
          ...dept,
          reality: newReality,
          kpi: newKpi,
          gaming: newGaming,
          shadowMetric: newShadow,
          latency: newLatency,
          reEscalations: newReEsc
        };
      }

      function computeMode(depts, cfg, prevMode) {
        const avgDiv =
          depts.reduce((s, d) => s + Math.abs(d.kpi - d.shadowMetric), 0) / depts.length;
        const maxReEsc = Math.max(...depts.map(d => d.reEscalations));
        if (avgDiv >= cfg.thresholds.crisis || maxReEsc >= cfg.thresholds.reEscalation) {
          return MODES.CRISIS;
        }
        if (avgDiv >= cfg.thresholds.tension) {
          if (prevMode === MODES.CRISIS && avgDiv > cfg.thresholds.tension * 0.8) {
            return MODES.CRISIS;
          }
          return MODES.TENSION;
        }
        if (prevMode === MODES.TENSION && avgDiv > cfg.thresholds.tension * 0.6) {
          return MODES.TENSION;
        }
        return MODES.NORMAL;
      }

      function computeOrgHealth(depts) {
        const avgDiv =
          depts.reduce((s, d) => s + Math.abs(d.kpi - d.reality), 0) / depts.length;
        const avgGaming = depts.reduce((s, d) => s + d.gaming, 0) / depts.length;
        return clamp(1 - avgDiv * 0.9 - avgGaming * 0.3, 0, 1);
      }

      function runTick(state, cfg) {
        if (state.tick >= cfg.ticks) return state;
        const shock = state.shockActive;
        const newBaseline = state.baselineDepts.map(d =>
          stepBaselineDept(d, cfg, shock)
        );
        const newAino = state.ainoDepts.map(d =>
          stepAinoDept(d, cfg, shock, state.mode)
        );
        const newMode = computeMode(newAino, cfg, state.mode);
        const maxReEsc = Math.max(...newAino.map(d => d.reEscalations));
        const riskDelta =
          newMode === MODES.CRISIS ? 0.01 :
          newMode === MODES.TENSION ? 0.005 :
          -0.003;
        const newCapture = clamp(state.captureRisk + riskDelta + maxReEsc * 0.001, 0, 1);
        const bh = computeOrgHealth(newBaseline);
        const ah = computeOrgHealth(newAino);
        const div =
          newAino.reduce((s, d) => s + Math.abs(d.kpi - d.shadowMetric), 0) /
          newAino.length;
        const modeIntensity =
          newMode === MODES.NORMAL ? 0.2 :
          newMode === MODES.TENSION ? 0.6 : 1.0;
        return {
          ...state,
          tick: state.tick + 1,
          baselineDepts: newBaseline,
          ainoDepts: newAino,
          mode: newMode,
          captureRisk: newCapture,
          history: {
            baseHealth: [...state.history.baseHealth, bh],
            ainoHealth: [...state.history.ainoHealth, ah],
            divergence: [...state.history.divergence, div],
            mode: [...state.history.mode, modeIntensity]
          }
        };
      }

      onmessage = (e) => {
        const { state, cfg, steps } = e.data;
        let s = state;
        for (let i = 0; i < steps; i++) {
          s = runTick(s, cfg);
        }
        postMessage(s);
      };
    `;

    const workerBlob = new Blob([workerCode], { type: "application/javascript" });
    const workerUrl = URL.createObjectURL(workerBlob);

    // ─── MiniChart ────────────────────────────────────────────────────────────
    function MiniChart({ data, color, label, height = 60 }) {
      if (!data || data.length < 2) return null;
      const w = 260, h = height;
      const pts = data
        .map((v, i) => `${(i / (data.length - 1)) * w},${h - v * h}`)
        .join(" ");
      return (
        <div className="mb-1">
          <div className="text-xs text-gray-400 mb-0.5">{label}</div>
          <svg width={w} height={h} className="bg-gray-900 rounded">
            <polyline
              points={pts}
              fill="none"
              stroke={color}
              strokeWidth="1.5"
            />
          </svg>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [cfg, setCfg] = useState(DEFAULT_CONFIG);
      const [state, setState] = useState(createInitialState);
      const [running, setRunning] = useState(false);
      const [finished, setFinished] = useState(false);
      const [useWorker, setUseWorker] = useState(false);

      const intervalRef = useRef(null);
      const workerRef = useRef(null);

      const reset = useCallback(() => {
        setRunning(false);
        setFinished(false);
        clearInterval(intervalRef.current);
        setState(createInitialState());
      }, []);

      const triggerShock = useCallback(() => {
        setState(s => ({ ...s, shockActive: true }));
        setTimeout(() => {
          setState(s => ({ ...s, shockActive: false }));
        }, cfg.shockDurationMs);
      }, [cfg.shockDurationMs]);

      // Worker initialisieren
      useEffect(() => {
        if (!useWorker) return;
        if (!workerRef.current) {
          workerRef.current = new Worker(workerUrl);
        }
        const worker = workerRef.current;
        worker.onmessage = (e) => {
          setState(e.data);
        };
        return () => {
          worker.terminate();
          workerRef.current = null;
        };
      }, [useWorker]);

      // Tick-Loop (ohne Worker)
      useEffect(() => {
        if (!running || useWorker) return;
        intervalRef.current = setInterval(() => {
          setState(prev => {
            const next = runTick(prev, cfg);
            if (next.tick >= cfg.ticks) {
              setRunning(false);
              setFinished(true);
              clearInterval(intervalRef.current);
            }
            return next;
          });
        }, 120);
        return () => clearInterval(intervalRef.current);
      }, [running, cfg, useWorker]);

      // Tick-Loop (mit Worker) – wir schicken z.B. 5 Schritte pro Batch
      useEffect(() => {
        if (!running || !useWorker || !workerRef.current) return;
        const worker = workerRef.current;
        intervalRef.current = setInterval(() => {
          setState(prev => {
            if (prev.tick >= cfg.ticks) {
              setRunning(false);
              setFinished(true);
              clearInterval(intervalRef.current);
              return prev;
            }
            worker.postMessage({ state: prev, cfg, steps: 5 });
            return prev;
          });
        }, 120);
        return () => clearInterval(intervalRef.current);
      }, [running, cfg, useWorker]);

      const avgBaseHealth =
        state.history.baseHealth.length
          ? state.history.baseHealth[state.history.baseHealth.length - 1]
          : 0.5;
      const avgAinoHealth =
        state.history.ainoHealth.length
          ? state.history.ainoHealth[state.history.ainoHealth.length - 1]
          : 0.5;

      const modeColor =
        state.mode === MODES.NORMAL
          ? "#22c55e"
          : state.mode === MODES.TENSION
          ? "#f59e0b"
          : "#ef4444";

      return (
        <div className="min-h-screen p-4 font-mono text-sm">
          <div className="max-w-5xl mx-auto">
            <div className="mb-4">
              <h1 className="text-lg font-bold text-white">
                AïnO Governance Simulation
              </h1>
              <p className="text-gray-400 text-xs mt-1">
                Baseline (KPI-only) vs AïnO (Shadow Metrics + Mode Logic) · {cfg.ticks} ticks · {DEPT_NAMES.length} departments
              </p>
            </div>

            <div className="flex flex-wrap gap-2 mb-4 items-center">
              <button
                onClick={() => setRunning(r => !r)}
                disabled={finished}
                className="px-4 py-1.5 rounded text-xs font-bold bg-blue-700 hover:bg-blue-600 disabled:opacity-40"
              >
                {running ? "⏸ Pause" : finished ? "✓ Done" : "▶ Run"}
              </button>
              <button
                onClick={reset}
                className="px-4 py-1.5 rounded text-xs font-bold bg-gray-700 hover:bg-gray-600"
              >
                ↺ Reset
              </button>
              <button
                onClick={triggerShock}
                disabled={!running}
                className="px-4 py-1.5 rounded text-xs font-bold bg-red-800 hover:bg-red-700 disabled:opacity-40"
              >
                ⚡ Political Shock
              </button>

              <label className="flex items-center gap-1 text-xs text-gray-400 ml-4">
                <input
                  type="checkbox"
                  className="mr-1"
                  checked={useWorker}
                  onChange={e => setUseWorker(e.target.checked)}
                />
                Use WebWorker (batch ticks)
              </label>

              <div className="flex items-center gap-2 ml-auto">
                <span className="text-xs text-gray-400">
                  Tick: {state.tick}/{cfg.ticks}
                </span>
                <div className="w-32 h-2 bg-gray-800 rounded overflow-hidden">
                  <div
                    className="h-full bg-blue-500 transition-all"
                    style={{ width: `${(state.tick / cfg.ticks) * 100}%` }}
                  />
                </div>
              </div>
            </div>

            <div className="flex items-center gap-3 mb-4 p-2 rounded bg-gray-900 border border-gray-800">
              <span className="text-xs text-gray-400">AïnO Mode:</span>
              <span className="font-bold text-sm" style={{ color: modeColor }}>
                {state.mode}
              </span>
              {state.shockActive && (
                <span className="text-red-400 text-xs animate-pulse">
                  ⚡ SHOCK ACTIVE
                </span>
              )}
              <span className="ml-auto text-xs text-gray-500">
                Shadow Capture Risk:{" "}
                <span
                  className={
                    state.captureRisk > 0.5 ? "text-red-400" : "text-green-400"
                  }
                >
                  {(state.captureRisk * 100).toFixed(0)}%
                </span>
              </span>
            </div>

            {/* Parameter Controls */}
            <div className="mb-4 grid grid-cols-3 gap-4 text-xs bg-gray-900 p-3 rounded border border-gray-800">
              <div>
                <div className="font-bold text-gray-300 mb-1">Simulation</div>
                <label className="block mb-1">
                  Ticks: {cfg.ticks}
                  <input
                    type="range"
                    min="20"
                    max="200"
                    value={cfg.ticks}
                    onChange={e =>
                      setCfg(c => ({ ...c, ticks: Number(e.target.value) }))
                    }
                    className="w-full"
                  />
                </label>
                <label className="block mb-1">
                  Gaming Rate: {cfg.gamingRate.toFixed(3)}
                  <input
                    type="range"
                    min="0.005"
                    max="0.05"
                    step="0.005"
                    value={cfg.gamingRate}
                    onChange={e =>
                      setCfg(c => ({ ...c, gamingRate: Number(e.target.value) }))
                    }
                    className="w-full"
                  />
                </label>
                <label className="block mb-1">
                  Shadow Noise: {cfg.shadowNoise.toFixed(3)}
                  <input
                    type="range"
                    min="0.005"
                    max="0.05"
                    step="0.005"
                    value={cfg.shadowNoise}
                    onChange={e =>
                      setCfg(c => ({ ...c, shadowNoise: Number(e.target.value) }))
                    }
                    className="w-full"
                  />
                </label>
              </div>
              <div>
                <div className="font-bold text-gray-300 mb-1">Thresholds</div>
                <label className="block mb-1">
                  Tension Divergence: {cfg.thresholds.tension.toFixed(2)}
                  <input
                    type="range"
                    min="0.1"
                    max="0.5"
                    step="0.05"
                    value={cfg.thresholds.tension}
                    onChange={e =>
                      setCfg(c => ({
                        ...c,
                        thresholds: {
                          ...c.thresholds,
                          tension: Number(e.target.value)
                        }
                      }))
                    }
                    className="w-full"
                  />
                </label>
                <label className="block mb-1">
                  Crisis Divergence: {cfg.thresholds.crisis.toFixed(2)}
                  <input
                    type="range"
                    min="0.3"
                    max="0.8"
                    step="0.05"
                    value={cfg.thresholds.crisis}
                    onChange={e =>
                      setCfg(c => ({
                        ...c,
                        thresholds: {
                          ...c.thresholds,
                          crisis: Number(e.target.value)
                        }
                      }))
                    }
                    className="w-full"
                  />
                </label>
              </div>
              <div>
                <div className="font-bold text-gray-300 mb-1">Mode Decay</div>
                <label className="block mb-1">
                  Decay Normal: {cfg.gamingDecay.Normal.toFixed(3)}
                  <input
                    type="range"
                    min="0.0"
                    max="0.05"
                    step="0.005"
                    value={cfg.gamingDecay.Normal}
                    onChange={e =>
                      setCfg(c => ({
                        ...c,
                        gamingDecay: {
                          ...c.gamingDecay,
                          Normal: Number(e.target.value)
                        }
                      }))
                    }
                    className="w-full"
                  />
                </label>
                <label className="block mb-1">
                  Decay Tension: {cfg.gamingDecay.Tension.toFixed(3)}
                  <input
                    type="range"
                    min="0.0"
                    max="0.05"
                    step="0.005"
                    value={cfg.gamingDecay.Tension}
                    onChange={e =>
                      setCfg(c => ({
                        ...c,
                        gamingDecay: {
                          ...c.gamingDecay,
                          Tension: Number(e.target.value)
                        }
                      }))
                    }
                    className="w-full"
                  />
                </label>
                <label className="block mb-1">
                  Decay Crisis: {cfg.gamingDecay.Crisis.toFixed(3)}
                  <input
                    type="range"
                    min="0.0"
                    max="0.05"
                    step="0.005"
                    value={cfg.gamingDecay.Crisis}
                    onChange={e =>
                      setCfg(c => ({
                        ...c,
                        gamingDecay: {
                          ...c.gamingDecay,
                          Crisis: Number(e.target.value)
                        }
                      }))
                    }
                    className="w-full"
                  />
                </label>
              </div>
            </div>

            {/* Two orgs */}
            <div className="grid grid-cols-2 gap-4 mb-4">
              <div className="bg-gray-900 rounded p-3 border border-gray-800">
                <div className="text-xs font-bold text-gray-300 mb-2">
                  📊 Baseline (KPI-only)
                </div>
                {state.baselineDepts.map(d => (
                  <div key={d.name} className="mb-2">
                    <div className="flex justify-between text-xs mb-0.5">
                      <span className="text-gray-400">{d.name}</span>
                      <span className="text-gray-500">
                        KPI{" "}
                        <span className="text-yellow-400">
                          {(d.kpi * 100).toFixed(0)}
                        </span>{" "}
                        | Real{" "}
                        <span className="text-blue-400">
                          {(d.reality * 100).toFixed(0)}
                        </span>{" "}
                        | Δ{" "}
                        <span className="text-red-400">
                          {((d.kpi - d.reality) * 100).toFixed(0)}
                        </span>
                      </span>
                    </div>
                    <div className="relative h-2 bg-gray-800 rounded overflow-hidden">
                      <div
                        className="absolute h-full bg-blue-600 rounded"
                        style={{ width: `${d.reality * 100}%` }}
                      />
                      <div
                        className="absolute h-full bg-yellow-500 opacity-70 rounded"
                        style={{ width: `${d.kpi * 100}%` }}
                      />
                    </div>
                  </div>
                ))}
                <div className="mt-2 text-xs">
                  Org Health:{" "}
                  <span
                    className="font-bold"
                    style={{ color: `hsl(${avgBaseHealth * 120},70%,55%)` }}
                  >
                    {(avgBaseHealth * 100).toFixed(0)}%
                  </span>
                </div>
              </div>

              <div className="bg-gray-900 rounded p-3 border border-gray-800">
                <div className="text-xs font-bold text-gray-300 mb-2">
                  🔷 AïnO (Shadow + Mode)
                </div>
                {state.ainoDepts.map(d => (
                  <div key={d.name} className="mb-2">
                    <div className="flex justify-between text-xs mb-0.5">
                      <span className="text-gray-400">{d.name}</span>
                      <span className="text-gray-500">
                        KPI{" "}
                        <span className="text-yellow-400">
                          {(d.kpi * 100).toFixed(0)}
                        </span>{" "}
                        | Shadow{" "}
                        <span className="text-purple-400">
                          {(d.shadowMetric * 100).toFixed(0)}
                        </span>{" "}
                        | Δ{" "}
                        <span className="text-red-400">
                          {((d.kpi - d.shadowMetric) * 100).toFixed(0)}
                        </span>
                      </span>
                    </div>
                    <div className="relative h-2 bg-gray-800 rounded overflow-hidden">
                      <div
                        className="absolute h-full bg-purple-600 rounded"
                        style={{ width: `${d.shadowMetric * 100}%` }}
                      />
                      <div
                        className="absolute h-full bg-yellow-500 opacity-70 rounded"
                        style={{ width: `${d.kpi * 100}%` }}
                      />
                    </div>
                  </div>
                ))}
                <div className="mt-2 text-xs">
                  Org Health:{" "}
                  <span
                    className="font-bold"
                    style={{ color: `hsl(${avgAinoHealth * 120},70%,55%)` }}
                  >
                    {(avgAinoHealth * 100).toFixed(0)}%
                  </span>
                </div>
              </div>
            </div>

            {/* Charts */}
            <div className="grid grid-cols-2 gap-4 mb-4">
              <div className="bg-gray-900 rounded p-3 border border-gray-800">
                <MiniChart
                  data={state.history.baseHealth}
                  color="#f59e0b"
                  label="Baseline Org Health over time"
                />
                <MiniChart
                  data={state.history.ainoHealth}
                  color="#a78bfa"
                  label="AïnO Org Health over time"
                />
              </div>
              <div className="bg-gray-900 rounded p-3 border border-gray-800">
                <MiniChart
                  data={state.history.divergence}
                  color="#f87171"
                  label="AïnO KPI↔Shadow Divergence"
                />
                <MiniChart
                  data={state.history.mode}
                  color="#34d399"
                  label="Mode Intensity (0=Normal, 1=Crisis)"
                />
              </div>
            </div>

            {/* Result */}
            {finished && (
              <div className="bg-gray-900 rounded p-4 border border-gray-700">
                <div className="text-sm font-bold text-white mb-2">
                  📋 Simulation Result
                </div>
                <div className="grid grid-cols-3 gap-4 text-xs">
                  <div>
                    <div className="text-gray-400 mb-1">Baseline final health</div>
                    <div className="text-2xl font-bold text-yellow-400">
                      {(avgBaseHealth * 100).toFixed(0)}%
                    </div>
                  </div>
                  <div>
                    <div className="text-gray-400 mb-1">AïnO final health</div>
                    <div className="text-2xl font-bold text-purple-400">
                      {(avgAinoHealth * 100).toFixed(0)}%
                    </div>
                  </div>
                  <div>
                    <div className="text-gray-400 mb-1">Shadow capture risk</div>
                    <div
                      className="text-2xl font-bold"
                      style={{
                        color: state.captureRisk > 0.5 ? "#f87171" : "#4ade80"
                      }}
                    >
                      {(state.captureRisk * 100).toFixed(0)}%
                    </div>
                  </div>
                </div>
                <div className="mt-3 text-xs text-gray-400 border-t border-gray-800 pt-2">
                  {avgAinoHealth > avgBaseHealth
                    ? "✅ AïnO outperformed baseline in this run. Shadow metrics reduced KPI gaming drift."
                    : "⚠️ AïnO did not outperform baseline in this run — complexity overhead or capture risk may have dominated."}
                  {state.captureRisk > 0.5 &&
                    " ⚠️ High shadow capture risk detected — Shadow Board integrity is a concern."}
                </div>
              </div>
            )}

            <div className="mt-3 text-xs text-gray-600 flex flex-wrap gap-4">
              <span>
                <span className="text-yellow-400">■</span> Reported KPI
              </span>
              <span>
                <span className="text-blue-400">■</span> True Reality (baseline)
              </span>
              <span>
                <span className="text-purple-400">■</span> Shadow Metric (AïnO)
              </span>
              <span>
                <span className="text-red-400">■</span> Divergence (KPI − Reality/Shadow)
              </span>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
